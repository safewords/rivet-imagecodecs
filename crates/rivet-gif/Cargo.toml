[package]
name = "rivet-gif"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
license-file = "../../LICENSE.md"
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rivet-gif"
authors.workspace = true
description = "A GIF87a/GIF89a decoder (LZW, palettes, interlace, transparency, disposal, animation compositing) and encoder (median-cut quantisation, optional dithering, frame differencing, loop count) in Rust, written from the GIF89a specification. rivet's GIF codec. Imported as `gif`."
keywords = ["gif", "image", "animation", "decoder", "encoder"]
categories = ["multimedia::images", "multimedia::encoding"]

[lib]
name = "gif"

[dependencies]

[dev-dependencies]
testkit = { path = "../testkit" }
