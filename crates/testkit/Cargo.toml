[package]
name = "testkit"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
publish = false
description = "Test support for the rivet image codecs: corpus location, PNG (through rivet-png) and PNM readers for reference renderings, a deterministic RNG, corruption helpers."

[dependencies]
# Reads the corpora's reference PNGs.
rpng = { package = "rivet-png", git = "https://github.com/rivet-transcoder/rivet-png", branch = "develop" }
