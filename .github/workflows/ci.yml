name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, but nothing here tests it there.

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      # Without the corpora the corpus tests skip and say so; the round
      # trips and robustness tests (run with overflow checks: the test
      # profile keeps them) do not need them.
      - name: Tests
        run: cargo test --workspace

  # The public corpora: the BMP Suite, libtiff's images and the GIF test
  # suite. They are data under their own licences, not in the repository;
  # this job fetches them (checked against tools/corpora.sha256) and runs
  # every comparison.
  corpora:
    name: public corpora
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: corpora
          key: corpora-${{ hashFiles('tools/corpora.sha256') }}
      - name: Fetch the corpora
        run: python3 tools/fetch_corpora.py corpora
      - name: Compare
        # The tests find ./corpora at the workspace root by default.
        run: cargo test --workspace -- --nocapture

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --workspace --release

  lint:
    name: clippy, rustfmt and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-gif rivet-bmp rivet-tiff
      submodule: crates/imagecodecs
